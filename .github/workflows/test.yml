name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Setup python
      run: uv python install

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests that do not need credentials
      run: uv run pytest -m "not requires_credentials"
